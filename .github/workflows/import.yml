name: Import project

on:
  workflow_dispatch:
  push:
    paths:
      - ".import/**"
      - ".github/workflows/import.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-24.04

    steps:
      - name: Configure Git default branch
        run: git config --global init.defaultBranch main

      - name: Checkout
        uses: actions/checkout@v5

      - name: Reassemble project archive
        run: |
          cat .import/part_*.b64 | base64 --decode > /tmp/meitowerdefence.zip
          mkdir -p /tmp/meitowerdefence
          unzip -q /tmp/meitowerdefence.zip -d /tmp/meitowerdefence
          cp -a /tmp/meitowerdefence/MeiTowerDefense/. .
          sed -i '/org.jetbrains.kotlin.android/d' build.gradle.kts app/build.gradle.kts
          rm -rf .import
          rm -f .github/workflows/import.yml

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.5.1"

      - name: Generate Gradle wrapper
        run: |
          gradle wrapper --gradle-version 9.5.1
          chmod +x gradlew

      - name: Commit imported project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "MeiTowerDefense Projekt importieren und CI einrichten"
          git push origin HEAD:main
