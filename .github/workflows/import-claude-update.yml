name: Import Claude Update

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/import-claude-update.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-24.04

    steps:
      - name: Configure Git default branch
        run: git config --global init.defaultBranch main

      - name: Checkout
        uses: actions/checkout@v5

      - name: Reassemble update
        run: |
          cat .import-update/part_*.b64 | base64 --decode > /tmp/claude-update.zip
          unzip -t /tmp/claude-update.zip
          rm -rf /tmp/claude-update
          mkdir -p /tmp/claude-update
          unzip -q /tmp/claude-update.zip -d /tmp/claude-update
          cp -a /tmp/claude-update/app/src/main/java/. app/src/main/java/
          cp -a /tmp/claude-update/app/src/test/java/. app/src/test/java/

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Test, lint and build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --warning-mode=all

      - name: Commit reviewed update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java app/src/test/java
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Claude-Update sinnvoll übernehmen"
          git push origin HEAD:main

