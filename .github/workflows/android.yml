name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Configure Git default branch
        run: git config --global init.defaultBranch main

      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Test, lint and build debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --warning-mode=all

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: MeiTowerdefence-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare APK for public test download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cp app/build/outputs/apk/debug/app-debug.apk MeiTowerdefence-latest.apk

      - name: Publish latest test APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest-build >/dev/null 2>&1; then
            gh release upload latest-build MeiTowerdefence-latest.apk --clobber
            gh release edit latest-build \
              --title "Latest Test Build" \
              --notes "Automatically updated from the latest successful build on main. Download MeiTowerdefence-latest.apk to install the current test version."
          else
            gh release create latest-build MeiTowerdefence-latest.apk \
              --target "$GITHUB_SHA" \
              --title "Latest Test Build" \
              --notes "Automatically updated from the latest successful build on main. Download MeiTowerdefence-latest.apk to install the current test version." \
              --prerelease
          fi
